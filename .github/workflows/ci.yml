name: Mirror Sync

on:
  repository_dispatch:
    types: [upstream_push]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      upstream_repository:
        description: "owner/repo to mirror from"
        required: false
      upstream_branch:
        description: "upstream branch to mirror"
        required: false

permissions:
  contents: write
  workflows: write

concurrency:
  group: mirror-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve sync settings
        id: settings
        env:
          EVENT_UPSTREAM_REPOSITORY: ${{ github.event.client_payload.upstream_repository }}
          EVENT_UPSTREAM_BRANCH: ${{ github.event.client_payload.upstream_branch }}
          INPUT_UPSTREAM_REPOSITORY: ${{ github.event.inputs.upstream_repository }}
          INPUT_UPSTREAM_BRANCH: ${{ github.event.inputs.upstream_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          upstream_repository="${EVENT_UPSTREAM_REPOSITORY:-${INPUT_UPSTREAM_REPOSITORY:-}}"
          upstream_branch="${EVENT_UPSTREAM_BRANCH:-${INPUT_UPSTREAM_BRANCH:-${DEFAULT_BRANCH}}}"
          target_branch="main"

          if [ -z "${upstream_repository}" ]; then
            repo_api_response="$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}")"
            upstream_repository="$(python -c 'import json,sys; d=json.loads(sys.stdin.read()); print((d.get("source") or {}).get("full_name") or (d.get("parent") or {}).get("full_name") or "")' <<< "${repo_api_response}")"
          fi

          if [ -z "${upstream_repository}" ]; then
            echo "::error::Unable to resolve upstream repository. Provide repository_dispatch client_payload.upstream_repository or workflow_dispatch input upstream_repository."
            exit 1
          fi

          echo "upstream_repository=${upstream_repository}" >> "${GITHUB_OUTPUT}"
          echo "upstream_branch=${upstream_branch}" >> "${GITHUB_OUTPUT}"
          echo "target_branch=${target_branch}" >> "${GITHUB_OUTPUT}"

      - name: Mirror upstream commit
        env:
          UPSTREAM_REPOSITORY: ${{ steps.settings.outputs.upstream_repository }}
          UPSTREAM_BRANCH: ${{ steps.settings.outputs.upstream_branch }}
          TARGET_BRANCH: ${{ steps.settings.outputs.target_branch }}
        run: |
          set -euo pipefail

          protected_paths=(
            ".github/workflows/ci.yml"
          )

          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --prune upstream "${UPSTREAM_BRANCH}"
          upstream_sha="$(git rev-parse "refs/remotes/upstream/${UPSTREAM_BRANCH}")"

          if git ls-remote --exit-code --heads origin "${TARGET_BRANCH}" >/dev/null 2>&1; then
            git fetch --prune origin "${TARGET_BRANCH}"
            current_sha="$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")"
          else
            current_sha=""
          fi

          if [ -n "${current_sha}" ] && [ "${current_sha}" = "${upstream_sha}" ]; then
            echo "Branch ${TARGET_BRANCH} is already synchronized."
            exit 0
          fi

          candidate_sha="${upstream_sha}"

          if [ -n "${current_sha}" ]; then
            if git diff --quiet "${current_sha}" "${upstream_sha}" -- "${protected_paths[@]}"; then
              echo "No protected workflow changes detected in upstream update."
            else
              echo "Protected workflow changes detected; preparing restoration commit."
              git checkout --detach --force "${upstream_sha}"

              for path in "${protected_paths[@]}"; do
                if git cat-file -e "${current_sha}:${path}" 2>/dev/null; then
                  mkdir -p "$(dirname "${path}")"
                  git show "${current_sha}:${path}" > "${path}"
                elif [ -e "${path}" ]; then
                  git rm -f -- "${path}"
                fi
              done

              if git diff --quiet "${current_sha}" --; then
                echo "Protected workflow state already restored on ${TARGET_BRANCH}."
                candidate_sha="${current_sha}"
              else
                git add -- "${protected_paths[@]}"
                git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                  commit -m "chore(sync): preserve repository workflow configuration"
                candidate_sha="$(git rev-parse HEAD)"
                echo "Created restoration commit ${candidate_sha}."
              fi
            fi
          fi

          if [ -n "${current_sha}" ] && [ "${candidate_sha}" = "${current_sha}" ]; then
            echo "Branch ${TARGET_BRANCH} is already synchronized with protected workflows preserved."
            exit 0
          fi

          if [ -z "${current_sha}" ]; then
            git push origin "${candidate_sha}:refs/heads/${TARGET_BRANCH}"
            exit 0
          fi

          if git merge-base --is-ancestor "${current_sha}" "${candidate_sha}"; then
            git push origin "${candidate_sha}:refs/heads/${TARGET_BRANCH}"
            exit 0
          fi

          archive_branch="archive/${TARGET_BRANCH}/$(date -u +%Y%m%d-%H%M%S)-${current_sha:0:12}"
          git push origin "${current_sha}:refs/heads/${archive_branch}"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${current_sha}" origin "${candidate_sha}:refs/heads/${TARGET_BRANCH}"
