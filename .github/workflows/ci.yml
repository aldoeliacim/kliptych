name: Mirror Sync

on:
  repository_dispatch:
    types: [upstream_push]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      upstream_repository:
        description: "owner/repo to mirror from"
        required: false
      upstream_branch:
        description: "upstream branch to mirror"
        required: false
      target_branch:
        description: "branch in this repository to overwrite"
        required: false

permissions:
  contents: write

concurrency:
  group: mirror-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve sync settings
        id: settings
        env:
          INPUT_UPSTREAM_REPOSITORY: ${{ github.event.inputs.upstream_repository }}
          INPUT_UPSTREAM_BRANCH: ${{ github.event.inputs.upstream_branch }}
          INPUT_TARGET_BRANCH: ${{ github.event.inputs.target_branch }}
          VAR_UPSTREAM_REPOSITORY: ${{ vars.UPSTREAM_REPOSITORY }}
          VAR_UPSTREAM_BRANCH: ${{ vars.UPSTREAM_BRANCH }}
          VAR_TARGET_BRANCH: ${{ vars.MIRROR_TARGET_BRANCH }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          upstream_repository="${INPUT_UPSTREAM_REPOSITORY:-${VAR_UPSTREAM_REPOSITORY:-}}"
          upstream_branch="${INPUT_UPSTREAM_BRANCH:-${VAR_UPSTREAM_BRANCH:-${DEFAULT_BRANCH}}}"
          target_branch="${INPUT_TARGET_BRANCH:-${VAR_TARGET_BRANCH:-${DEFAULT_BRANCH}}}"

          if [ -z "${upstream_repository}" ]; then
            echo "::error::Set repository variable UPSTREAM_REPOSITORY (owner/repo) or pass workflow_dispatch input upstream_repository."
            exit 1
          fi

          echo "upstream_repository=${upstream_repository}" >> "${GITHUB_OUTPUT}"
          echo "upstream_branch=${upstream_branch}" >> "${GITHUB_OUTPUT}"
          echo "target_branch=${target_branch}" >> "${GITHUB_OUTPUT}"

      - name: Mirror upstream commit
        env:
          UPSTREAM_REPOSITORY: ${{ steps.settings.outputs.upstream_repository }}
          UPSTREAM_BRANCH: ${{ steps.settings.outputs.upstream_branch }}
          TARGET_BRANCH: ${{ steps.settings.outputs.target_branch }}
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --prune upstream "${UPSTREAM_BRANCH}"
          git push --force origin "refs/remotes/upstream/${UPSTREAM_BRANCH}:refs/heads/${TARGET_BRANCH}"
